[project]
name = "llm-engineering-exercise"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.97.0",
    "beautifulsoup4>=4.14.3",
    "bitsandbytes>=0.49.2",
    "datasets>=3.6.0",
    "diffusers>=0.32.0",
    "dotenv>=0.9.9",
    "google-genai>=1.74.0",
    "gradio>=6.15.0",
    "huggingface-hub>=0.24.0",
    "langchain>=1.3.1",
    "langchain-anthropic>=1.4.3",
    "langchain-google-genai>=4.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "litellm>=1.86.1",
    "lxml>=6.1.0",
    "openai>=2.33.0",
    "playwright>=1.59.0",
    "requests>=2.33.1",
    "soundfile>=0.12.1",
    "transformers>=4.40.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "torchaudio>=2.11.0",
    "accelerate>=1.13.0",
    "sentencepiece>=0.2.0",
    "peft>=0.17.0",
]

# Pull the CUDA (cu130) builds of the torch stack instead of the default CPU wheels.
# Without this, `uv sync` resolves torch==x.y.z+cpu and CUDA/bitsandbytes break.
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
